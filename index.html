<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- AE-Simulator · D1 · мокап A2 v2 (редактор сценаріїв) · живе доки: вирок D1 не перенесено в продукт (D2) -->
<title>AE · A2 v2 · мокап D1</title>
<style>
:root{
  --radius:14px; --r-md:12px;
  --anc-yellow:#FFE241; --anc-yellow-50:#FFF0A0; --anc-yellow-25:#FFF8D0;
  --anc-blue:#008ECC; --anc-blue-25:#BFE3F2; --anc-canvas:#FFFEF6; --anc-plate:#FFFCEC;
  --anc-text:#1C1E24; --anc-text-2:#4F4F4F; --anc-gray:#6E6E77; --anc-gray-light:#9B9CA1;
  --anc-border:#E7E7E7; --anc-positive:#1E815D; --loss:#A8402B; --zf:#A0761B; --vtm:#0F6B4A;
  --shadow:0 6px 22px #1C1E2410;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter","Segoe UI",-apple-system,system-ui,sans-serif;color:var(--anc-text);background:var(--anc-canvas);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ── рейка (спрощено, лише для масштабу) ── */
.rail{position:fixed;left:0;top:50%;transform:translateY(-50%);width:210px;background:#fff;border:1px solid var(--anc-border);border-left:0;border-radius:0 18px 18px 0;box-shadow:var(--shadow);padding:18px 10px;z-index:5}
.rail .brand{display:flex;gap:10px;align-items:center;padding:0 8px 14px;border-bottom:1px solid var(--anc-border)}
.rail .logo{width:34px;height:34px;border-radius:50%;background:var(--anc-yellow);display:grid;place-items:center;font-weight:800;font-size:11px;color:var(--anc-blue)}
.rail .brand b{display:block;font-size:14px}.rail .brand small{font-size:11px;color:var(--anc-gray)}
.rail nav{display:grid;gap:2px;padding:10px 0}
.rail nav a{display:block;padding:10px 12px;border-radius:10px;color:var(--anc-gray);text-decoration:none;font-size:13px}
.rail nav a.on{background:var(--anc-yellow-25);color:var(--anc-text);font-weight:700;box-shadow:inset 3px 0 0 var(--anc-blue)}

/* ── сторінка ── */
.page{padding:20px 20px 40px 234px;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--anc-border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ── список: 1:1 з колонки сценаріїв E1 ── */
.scenario-list{position:sticky;top:20px;display:flex;flex-direction:column;max-height:calc(100vh - 40px);overflow:hidden}
.list-tools{padding:16px;border-bottom:1px solid var(--anc-border)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.list-head h2{margin:0;font-size:16px}
.health{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--anc-positive);font-weight:600}
.health::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.search{width:100%;min-height:38px;padding:0 12px;border:1px solid #D9D9DC;border-radius:10px;background:#fff}
.group-filters{display:flex;flex-wrap:wrap;gap:7px;padding-top:11px}
.group-filters button{min-height:32px;padding:0 10px;border:1px solid var(--anc-border);border-radius:7px;color:var(--anc-text-2);background:#fff;font-size:12px}
.group-filters button.active{border-color:var(--anc-blue);color:var(--anc-text);background:var(--anc-yellow-25);font-weight:700}
.group-filters .manage{border-style:dashed;color:var(--anc-gray)}
.scenario-items{overflow:auto;flex:1}
.scenario-item{display:grid;grid-template-columns:58px minmax(0,1fr) 10px;align-items:center;gap:11px;width:100%;min-height:64px;padding:10px 15px;border:0;border-bottom:1px solid var(--anc-border);border-left:3px solid transparent;background:#fff;text-align:left}
.scenario-item:hover,.scenario-item.active{border-left-color:var(--anc-blue);background:var(--anc-yellow-25)}
.scenario-no{color:var(--anc-gray);font-size:12px;font-weight:700;white-space:nowrap}
.scenario-item b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scenario-item small{display:block;margin-top:3px;color:var(--anc-gray);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%}
.dot.draft{background:var(--zf)} .dot.err{background:var(--loss)}

/* ── форма ── */
.editor{min-width:0;container-type:inline-size}
.ed-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:14px;padding:16px 0 14px;background:linear-gradient(var(--anc-canvas) 80%,transparent)}
.ed-head .t{min-width:0;flex:1}
.eyebrow{font-size:12px;color:var(--anc-gray);font-weight:600;letter-spacing:.02em}
.ed-head h1{margin:2px 0 0;font-size:24px;line-height:1.2;letter-spacing:-.01em}
@container (max-width:780px){ .ed-head{flex-wrap:wrap;row-gap:10px} .ed-head .t{flex-basis:100%} .ed-head #state{margin-right:auto} }
select.in{height:42px;padding:0 10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:#E6F3EC;color:var(--anc-positive)} .pill.draft{background:#FBF1DA;color:#86610F} .pill.err{background:#F7E3DE;color:var(--loss)}
.btn{min-height:40px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--anc-border);background:#fff;font-weight:600}
.btn.primary{background:var(--anc-yellow);border-color:#E8C800;color:var(--anc-text)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--anc-text-2)}

.cards{display:grid;grid-template-columns:1fr;gap:16px}
@container (min-width:860px){ .cards{grid-template-columns:1fr 1fr} .span2{grid-column:1/-1} }
.card{padding:18px 20px 20px}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--anc-yellow-25);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:grid;gap:6px;margin-bottom:12px}
.f:last-child{margin-bottom:0}
.f>label,.lab{font-size:12px;font-weight:600;color:var(--anc-text-2);display:flex;justify-content:space-between;gap:8px}
.lab .cnt{font-weight:500;color:var(--anc-gray-light)}
.in{width:100%;min-height:42px;padding:9px 12px;border:1px solid #D9D9DC;border-radius:10px;background:#fff;transition:border-color .15s,background .15s}
.in:focus{outline:none;border-color:var(--anc-blue);background:#fff;box-shadow:0 0 0 3px var(--anc-blue-25)}
textarea.in{resize:vertical;min-height:70px}
.in.changed{border-color:#E2C36F;box-shadow:inset 3px 0 0 var(--anc-yellow)}
.quote{position:relative}
.quote .in{padding-left:30px;font-style:italic}
.quote::before{content:"“";position:absolute;left:11px;top:4px;font-size:26px;color:var(--anc-blue);font-style:normal}
.msg{font-size:12px;color:var(--loss);display:flex;gap:6px}
.msg[hidden]{display:none}
.f.bad .in{border-color:var(--loss);background:#FDF4F2}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 6px 0 10px;border:1px solid var(--anc-border);border-radius:8px;background:#fff;font-size:12.5px}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:6px;color:var(--anc-gray)}
.chip button:hover{background:var(--anc-border)}
.chip.main{border-color:var(--anc-blue);background:#EEF8FC}
.chip .star{font-size:11px;color:var(--anc-blue);font-weight:700}
.chip.add{border-style:dashed;color:var(--anc-gray);padding:0 10px;background:transparent}
.hintline{font-size:12px;color:var(--anc-gray)}
.prod{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--anc-border);border-radius:10px;background:var(--anc-plate);font-size:13px}
.prod .pr{color:var(--anc-gray);white-space:nowrap}

.ideals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ideal{border:1px solid var(--anc-border);border-radius:12px;padding:12px;display:grid;gap:4px;background:#fff}
.ideal .k{font-size:11px;font-weight:800;letter-spacing:.06em}
.ideal.vtm .k{color:var(--vtm)} .ideal.stm .k{color:var(--zf)}
.ideal .n{font-size:13px;font-weight:600}
.ideal .gain{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ideal .gain small{font-size:11px;font-weight:600;color:var(--anc-gray)}
.ideal .chg{justify-self:start;border:0;background:none;color:var(--anc-blue);font-size:12px;font-weight:600;padding:0}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}
.tg{display:flex;align-items:center;gap:8px;font-size:13px}
.tg input{width:18px;height:18px;accent-color:var(--anc-blue)}
.foot{margin:18px 2px 0;font-size:11px;color:var(--anc-gray-light)}

/* ── прев'ю: сценарій очима фармацевта ── */
.pv{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.pv-h{padding:14px 16px 10px;border-bottom:1px solid var(--anc-border)}
.pv-h b{font-size:14px}.pv-h small{display:block;font-size:11.5px;color:var(--anc-gray)}
.pv-b{padding:14px 16px 16px;display:grid;gap:12px}
.pv .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--anc-gray);font-weight:700}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--anc-yellow-25);color:var(--anc-text-2)}
.pv h4{margin:0;font-size:18px;line-height:1.25}
.who{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;background:var(--anc-blue-25);display:grid;place-items:center;font-weight:800;color:var(--anc-blue)}
.who b{display:block;font-size:13.5px}.who span{font-size:12px;color:var(--anc-gray)}
.mood{font-size:12.5px;color:var(--anc-text-2);font-style:italic;padding-left:10px;border-left:2px solid var(--anc-border)}
.sit{font-size:12px;color:var(--anc-gray)}
.bubble{background:#E7ECE8;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13.5px}
.sec{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--anc-gray-light);text-transform:uppercase}
.sep{display:flex;align-items:center;gap:8px;margin-top:4px}
.sep::after{content:"";flex:1;height:1px;background:var(--anc-border)}
.pv .prod{font-size:12.5px;padding:7px 10px}
.pv .ideals{grid-template-columns:1fr;margin:0}
.pv .ideal{padding:9px 11px;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.pv .ideal .gain{font-size:14px}
.goal{font-size:12.5px;color:var(--anc-text-2)}

/* ── діалог груп ── */
dialog{border:0;border-radius:var(--radius);padding:0;width:min(420px,92vw);box-shadow:0 20px 60px #1C1E2440}
dialog::backdrop{background:#1C1E2440}
.dg-h{padding:16px 18px;border-bottom:1px solid var(--anc-border);display:flex;justify-content:space-between;align-items:center}
.dg-h b{font-size:16px}
.dg-b{padding:12px 18px;display:grid;gap:8px;max-height:60vh;overflow:auto}
.grow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.grow small{color:var(--anc-gray);font-size:12px;white-space:nowrap}
.dg-f{padding:12px 18px 16px;display:flex;gap:8px;justify-content:space-between;border-top:1px solid var(--anc-border)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--anc-text);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

@media (max-width:1440px){
  .page{grid-template-columns:280px minmax(0,1fr)}
  .pv{grid-column:2;position:static;max-height:none}
}
</style>
</head>
<body>
<aside class="rail" aria-label="Навігація (спрощено для масштабу)">
  <div class="brand"><div class="logo">АНЦ</div><div><b>Тренажер</b><small>Навчання фармацевтів</small></div></div>
  <nav><a>Дашборд</a><a class="on">Сценарії</a><a>Каталог</a><a>AI / Моделі</a><a>Промпти</a><a>Система</a></nav>
</aside>

<main class="page">
  <section class="panel scenario-list" aria-label="Сценарії">
    <div class="list-tools">
      <div class="list-head"><h2>Сценарії</h2><span class="health" id="health"></span></div>
      <input class="search" id="q" type="search" placeholder="Пошук за назвою або номером">
      <div class="group-filters" id="groups"></div>
    </div>
    <div class="scenario-items" id="items"></div>
  </section>

  <section class="editor" id="editor"></section>

  <aside class="panel pv" aria-label="Як побачить фармацевт">
    <div class="pv-h"><b>Як побачить фармацевт</b><small>Оновлюється, поки ви пишете</small></div>
    <div class="pv-b" id="pv"></div>
  </aside>
</main>

<dialog id="dg">
  <div class="dg-h"><b>Групи сценаріїв</b><button class="btn ghost" data-close>✕</button></div>
  <div class="dg-b" id="dgb"></div>
  <div class="dg-f"><button class="btn" id="dgAdd">+ Нова група</button><button class="btn primary" data-close>Готово</button></div>
</dialog>
<div class="toast" id="toast"></div>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => (v==null ? '—' : v.toLocaleString('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₴');

const st = { sel: Object.keys(D.full)[0], grp:'Усі', q:'', draft:{}, groups:[...new Set(D.list.map(s=>s.grp))] };
const orig = id => D.full[id];
const cur  = id => ({...orig(id), ...(st.draft[id]||{})});
const changes = id => Object.keys(st.draft[id]||{}).filter(k => JSON.stringify(st.draft[id][k]) !== JSON.stringify(orig(id)[k]));
const problems = s => (s.cats.includes(s.main) ? [] : [{f:'main', m:'Головна категорія має бути серед обраних'}]);

function set(k, v){ (st.draft[st.sel] ||= {})[k]=v; if(!changes(st.sel).includes(k)) delete st.draft[st.sel][k]; paint(k); }

/* ── список ── */
function drawList(){
  const n = D.list.length;
  $('#health').textContent = n+' · звірено';
  $('#groups').innerHTML = ['Усі',...st.groups].map(g=>`<button class="${g===st.grp?'active':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('')
    + `<button class="manage" id="mg" title="Створити або перейменувати групу">✎ Групи</button>`;
  const q = st.q.trim().toLowerCase();
  const rows = D.list.filter(s => (st.grp==='Усі'||s.grp===st.grp) && (!q || s.title.toLowerCase().includes(q) || String(s.no||'').includes(q)));
  $('#items').innerHTML = rows.map(s => {
    const id=String(s.id), full=!!D.full[id];
    const c = full ? cur(id) : s;
    const mark = full ? (problems(c).length ? 'err' : changes(id).length ? 'draft' : '') : '';
    return `<button class="scenario-item ${id===st.sel?'active':''}" data-id="${id}">
      <span class="scenario-no">${s.no?'#'+s.no:'на місці'}</span>
      <span><b>${esc(c.title)}</b><small>${esc(c.grp)} · ${esc(s.character)}</small></span>
      <span class="dot ${mark}" title="${mark==='err'?'Є проблема':mark==='draft'?'Є незбережені зміни':''}"></span></button>`;
  }).join('') || '<p style="padding:16px;color:var(--anc-gray)">Нічого не знайдено</p>';
}

  const pool = s.cats.flatMap(c => D.cats[c].items);
  const opt = (sel, list) => list.map(i=>`<option value="${i.c}" ${sel===i.c?'selected':''}>${esc(i.n)}</option>`).join('');
  const ideal = (k, cls, lab) => { const i=item(s[k][0]); return `<div class="ideal ${cls}"><span class="k">${lab}</span>
      <select class="in" data-k="${k}" style="height:36px;padding:0 8px;font-size:12.5px">${opt(s[k][0], pool.some(p=>p.c===s[k][0]) ? pool : [i, ...pool].filter(Boolean))}</select>
      <span class="gain num">+${money(i?.b)} <small>бонусу</small></span></div>`; };

  $('#editor').innerHTML = `
  <div class="ed-head">
    <div class="t"><div class="eyebrow">СЦЕНАРІЙ ${s.no?'#'+s.no:'НА МІСЦІ'} · ${esc(s.grp).toUpperCase()}</div><h1 id="h1">${esc(s.title)}</h1></div>
    <span id="state"></span>
    <button class="btn ghost" id="undo">Скасувати</button>
    <button class="btn primary" id="pub">Опублікувати</button>
  </div>
  <div class="cards">
    <div class="panel card span2">
      <div class="row2">
        <div class="f"><label for="f-title">Назва сценарію</label><input class="in" id="f-title" data-k="title" value="${esc(s.title)}"></div>
        <div class="f"><label for="f-grp">Група</label>
          <select class="in" id="f-grp" data-k="grp">${st.groups.map(g=>`<option ${g===s.grp?'selected':''}>${esc(g)}</option>`).join('')}<option value="__new">+ Нова група…</option></select></div>
      </div>
    </div>

    <div class="panel card">
      <h3><span class="ic">👤</span>Клієнт</h3>
      <div class="f"><label for="f-who">Хто прийшов</label><input class="in" id="f-who" data-k="who" value="${esc(s.who)}"></div>
      <div class="f"><label for="f-ch">Характер</label><select class="in" id="f-ch" data-k="character">${D.chars.map(c=>`<option ${c===s.character?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="f"><div class="lab"><label for="f-mood">Настрій</label><span class="cnt" id="cnt"></span></div><textarea class="in" id="f-mood" data-k="mood" maxlength="90" rows="2">${esc(s.mood)}</textarea></div>
    </div>

    <div class="panel card">
      <h3><span class="ic">💬</span>Ситуація</h3>
      <div class="f"><label for="f-mode">Обставини</label><input class="in" id="f-mode" data-k="mode" value="${esc(s.mode)}"></div>
      <div class="f"><label for="f-open">Перша фраза клієнта</label><div class="quote"><textarea class="in" id="f-open" data-k="open" rows="3">${esc(s.open)}</textarea></div></div>
    </div>

    <div class="panel card">
      <h3><span class="ic">🧾</span>Товари</h3>
      <div class="f" id="f-cats"><span class="lab">Категорії</span>
        <div class="chips">${catChips}<select class="chip add" id="addcat" aria-label="Додати категорію"><option value="">+ Додати</option>${catAdd}</select></div></div>
      <div class="f" id="fw-main"><label for="f-main">Головна категорія</label>
        <select class="in" id="f-main" data-k="main">${Object.entries(D.cats).map(([k,v])=>`<option value="${k}" ${k===s.main?'selected':''}>${esc(v.label)}</option>`).join('')}</select>
        <div class="msg" id="m-main" hidden>⚠ <span></span></div></div>
      <div class="f"><label for="f-order">Клієнт просить</label><select class="in" id="f-order" data-k="order">${opt(s.order[0], pool.concat(s.order.map(item).filter(Boolean).filter(i=>!pool.some(p=>p.c===i.c))))}</select></div>
    </div>

    <div class="panel card">
      <h3><span class="ic">⭐</span>Рекомендації</h3>
      <div class="ideals">${ideal('bv','vtm','ВТМ')}${ideal('bm','stm','СТМ')}</div>
      <div class="f"><label for="f-goal">Мета розмови</label><textarea class="in" id="f-goal" data-k="goal" rows="3">${esc(s.goal)}</textarea></div>
      <div class="toggles"><label class="tg"><input type="checkbox" data-k="trap" ${s.trap?'checked':''}>Пастка: заміна шкодить</label><label class="tg"><input type="checkbox" data-k="noSale" ${s.noSale?'checked':''}>Без продажу</label></div>
    </div>
  </div>
  `;
  paint();
}

/* ── живе: стан, позначки змін, проблеми, прев'ю ── */
function paint(changedKey){
  const s = cur(st.sel), ch = changes(st.sel), pr = problems(s);
  const state = pr.length ? `<span class="pill err">Є проблема</span>`
    : ch.length ? `<span class="pill draft">Чернетка · ${ch.length} ${ch.length===1?'зміна':ch.length<5?'зміни':'змін'}</span>`
    : `<span class="pill ok">Опубліковано</span>`;
  $('#state').innerHTML = state;
  $('#pub').disabled = !ch.length || pr.length>0;
  $('#undo').disabled = !ch.length;
  $('#h1').textContent = s.title;
  document.querySelectorAll('[data-k]').forEach(e => e.classList.toggle('changed', ch.includes(e.dataset.k)));
  const m=$('#m-main'); $('#fw-main').classList.toggle('bad', pr.length>0); m.hidden=!pr.length; if(pr.length) m.querySelector('span').textContent=pr[0].m;
  $('#cnt').textContent = (s.mood||'').length+' / 90';
  drawPreview(s); drawList();
}

function drawPreview(s){
  const o=item(s.order[0]), bv=item(s.bv[0]), bm=item(s.bm[0]);
  const ini=(s.who||'?').trim()[0];
  $('#pv').innerHTML = `
    <div class="top"><span>${s.no?'#'+s.no:'На місці'}</span><span class="tag">${esc(s.grp)}</span></div>
    <h4>${esc(s.title)}</h4>
    <div class="who"><div class="ava">${esc(ini)}</div><div><b>${esc(s.who)}</b><span>${esc(s.character)}</span></div></div>
    <div class="mood">${esc(s.mood)}</div>
    <div class="sit">${esc(s.mode)}</div>
    <div class="bubble">${esc(s.open)}</div>
    <div class="sec">Просить</div>
    <div class="prod"><span>${esc(o?.n)}</span><span class="pr num">${money(o?.p)}</span></div>
    <div class="sec sep">Відкриється в розборі</div>
    <div class="ideals">
      <div class="ideal vtm"><span class="k">ВТМ</span><span class="n">${esc(bv?.n)}</span><span class="gain num">+${money(bv?.b)}</span></div>
      <div class="ideal stm"><span class="k">СТМ</span><span class="n">${esc(bm?.n)}</span><span class="gain num">+${money(bm?.b)}</span></div>
    </div>
    <div class="goal">${esc(s.goal)}</div>`;
}

/* ── події ── */
document.addEventListener('input', e => {
  const k=e.target.dataset.k; if(!k) return;
  if(e.target.id==='q') return;
  if(k==='grp') return;
  const v = e.target.type==='checkbox' ? e.target.checked : (['order','bv','bm'].includes(k) ? [e.target.value] : e.target.value);
  set(k, v);
});
document.addEventListener('change', e => {
  const t=e.target;
  if(t.id==='f-grp'){
    if(t.value==='__new'){ const n=prompt('Назва нової групи'); if(n&&n.trim()){ if(!st.groups.includes(n.trim())) st.groups.push(n.trim()); set('grp', n.trim()); drawEditor(); } else t.value=cur(st.sel).grp; return; }
    set('grp', t.value); drawEditor(); return;
  }
  if(t.id==='addcat' && t.value){ set('cats', [...cur(st.sel).cats, t.value]); drawEditor(); return; }
  if(['main','bv','bm','order','character'].includes(t.dataset.k)){ drawEditor(); }
});
document.addEventListener('click', e => {
  const t=e.target.closest('button,[data-rmcat]'); if(!t) return;
  if(t.dataset.id){ if(!D.full[t.dataset.id]){ toast('У мокапі повністю заповнені лише #4417 і #3391'); return; } st.sel=t.dataset.id; drawEditor(); return; }
  if(t.dataset.g){ st.grp=t.dataset.g; drawList(); return; }
  if(t.dataset.rmcat){ set('cats', cur(st.sel).cats.filter(c=>c!==t.dataset.rmcat)); drawEditor(); return; }
  if(t.id==='undo'){ delete st.draft[st.sel]; drawEditor(); toast('Зміни скасовано'); return; }
  if(t.id==='pub'){ Object.assign(D.full[st.sel], st.draft[st.sel]); delete st.draft[st.sel]; drawEditor(); toast('Опубліковано (у мокапі — без запису)'); return; }
  if(t.id==='mg'){ drawGroups(); $('#dg').showModal(); return; }
  if(t.id==='dgAdd'){ const n=prompt('Назва нової групи'); if(n&&n.trim()&&!st.groups.includes(n.trim())){ st.groups.push(n.trim()); drawGroups(); drawList(); } return; }
  if(t.hasAttribute('data-close')){ $('#dg').close(); return; }
});
$('#q').addEventListener('input', e => { st.q=e.target.value; drawList(); });

function drawGroups(){
  $('#dgb').innerHTML = st.groups.map((g,i)=>{ const n=D.list.filter(s=>s.grp===g).length;
    return `<div class="grow"><input class="in" data-gi="${i}" value="${esc(g)}"><small>${n} ${n===1?'сценарій':n>1&&n<5?'сценарії':'сценаріїв'}</small></div>`; }).join('')
    + `<p class="hintline">Нова назва застосується до всіх сценаріїв групи після публікації.</p>`;
  $('#dgb').querySelectorAll('[data-gi]').forEach(inp => inp.addEventListener('change', () => {
    const old=st.groups[+inp.dataset.gi], nu=inp.value.trim(); if(!nu||nu===old) { inp.value=old; return; }
    st.groups[+inp.dataset.gi]=nu; D.list.forEach(s=>{ if(s.grp===old) s.grp=nu; });
    Object.values(D.full).forEach(s=>{ if(s.grp===old) s.grp=nu; }); if(st.grp===old) st.grp=nu;
    drawGroups(); drawEditor(); toast(`«${old}» → «${nu}»`);
  }));
}

drawEditor();
</script>
</body>
</html>
